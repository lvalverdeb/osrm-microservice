[project]
name = "osrm-api-gateway-examples"
version = "0.1.0"
description = "Example client scripts for OSRM API Gateway"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "folium>=0.16.0",
    "pydantic-settings>=2.2.0",
]

# Installing this project puts `config` on sys.path, so every example -- not just
# the launcher, which reaches it through a sys.path insert -- reads examples/.env
# through the same typed settings object. Without it each script fell back to its
# own hardcoded URL and silently ignored .env when run directly.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/config.py"]
