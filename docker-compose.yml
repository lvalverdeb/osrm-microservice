services:
  osrm-data-builder:
    image: osrm-data-builder:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.builder
      args:
        - PROFILE=${PROFILE:-car}
        - OSM_FILE=${OSM_FILE:-costa-rica-latest.osm.pbf}
    profiles:
      - build

  osrm:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.osrm
      args:
        - PROFILE=${PROFILE:-car}
        - OSM_FILE=${OSM_FILE:-costa-rica-latest.osm.pbf}
    container_name: osrm-backend
    ports:
      - "${OSRM_PORT:-5000}:5000"
    command: sh -c "osrm-routed --algorithm mld --max-trip-size 200 /data/$${PROFILE}/$${OSM_BASE}.osrm"
    restart: always
    healthcheck:
      # osrm-backend has no curl/wget; bash's /dev/tcp is the only connectivity
      # probe available without adding packages to the upstream image.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: osrm-cache
    command: redis-server --save "" --appendonly no
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osrm-api-gateway
    ports:
      - "${API_PORT:-8080}:8000"
    environment:
      - OSRM_BASE_URL=http://osrm-backend:5000
      - REDIS_URL=redis://osrm-cache:6379/0
    depends_on:
      osrm:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
