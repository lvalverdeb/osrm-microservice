# Cache-only Redis for the OSRM API Gateway.
#
# Layered on the port's own config so package updates still flow through; only
# the directives below differ. Installed as /usr/local/etc/redis-osrm-cache.conf
# and selected with `sysrc redis_config=...` by deploy/freebsd/install.sh.

include /usr/local/etc/redis.conf

# Mirrors docker-compose.yml's `redis-server --save "" --appendonly no`. This is
# a cache: snapshots buy nothing, and with stop-writes-on-bgsave-error set (the
# port's default) a failed fork on a small box would make redis start refusing
# writes -- turning a cache miss into an outage.
save ""
appendonly no

# A jail has no per-jail loopback source address: a client inside the jail
# connecting to 127.0.0.1 still leaves with a source of ip4.addr, so redis sees
# a non-loopback peer and protected mode answers DENIED to every command. That
# silently disabled the L2 cache and the rate limiter's shared storage.
#
# Turning protected mode off is safe *because* the listener is bound to the
# jail's real loopback -- see `ip4.addr += "lo1|127.0.0.1"` in the host's
# jail.conf. Sibling jails cannot reach it on either address; only this jail and
# root on the host can, and host root can jexec in regardless.
protected-mode no
