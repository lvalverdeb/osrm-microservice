# Docker deployment path. See ../../docs/deployment.md for the other one.
#
# Every build context is the repository root -- the API image copies src/app and
# pyproject.toml, the builder image copies data/ -- so the contexts below are
# ../.. and the dockerfile: paths are root-relative. That makes this file usable
# from any working directory:
#
#   docker compose -f deploy/docker/docker-compose.yml -p osrm-microservice up
#
# but prefer `make compose-up`, which sequences the builds and health checks.
# The -p is not optional when invoking directly: without it the project name
# defaults to this file's directory ("docker") and the default network is
# renamed. .dockerignore stays at the repository root because that is where
# Docker reads it from: the root of the build context, not next to the Dockerfile.
services:
  osrm-data-builder:
    image: osrm-data-builder:latest
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.builder
      args:
        - PROFILE=${PROFILE:-car}
        - OSM_FILE=${OSM_FILE:-costa-rica-latest.osm.pbf}
    profiles:
      - build

  osrm:
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.osrm
      args:
        - PROFILE=${PROFILE:-car}
        - OSM_FILE=${OSM_FILE:-costa-rica-latest.osm.pbf}
    container_name: osrm-backend
    ports:
      - "${OSRM_PORT:-5000}:5000"
    command: sh -c "osrm-routed --algorithm mld --max-trip-size 200 /data/$${PROFILE}/$${OSM_BASE}.osrm"
    restart: always
    healthcheck:
      # osrm-backend has no curl/wget; bash's /dev/tcp is the only connectivity
      # probe available without adding packages to the upstream image.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: osrm-cache
    command: redis-server --save "" --appendonly no
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: osrm-api-gateway
    ports:
      - "${API_PORT:-8080}:8000"
    # Tier 1: shared app settings, the same file the jail installs. Resolved
    # relative to this file's directory, like the build contexts above.
    env_file:
      - ../env/app.env
    # Tier 2: the only settings that are deployment-specific. `environment:`
    # outranks `env_file:`, so these win over the shared file's values.
    environment:
      - OSRM_BASE_URL=http://osrm-backend:5000
      - REDIS_URL=redis://osrm-cache:6379/0
      # Vertical scaling. Defaults to 1, matching the jail's
      # osrm_api_gateway_workers -- raising it is opt-in per environment. These
      # are tokio worker threads inside one process sharing one metrics
      # registry, so unlike the Python image there is no multiprocess metrics
      # directory to prepare and no under-reporting to avoid.
      - WORKERS=${API_WORKERS:-1}
      # Comma-separated proxy addresses or CIDRs, or `*`. Empty means
      # X-Forwarded-For is ignored entirely and the limiter keys on the
      # immediate peer. Set this when a load balancer fronts the gateway, or
      # every client shares one bucket keyed on the balancer.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-}
    depends_on:
      osrm:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # The FastAPI gateway this port replaced, kept as the rollback target and the
  # reference the parity harness diffs against. Behind a profile so a plain
  # `make compose-up` never starts it; `make compose-python-up` does.
  #
  # It publishes a different port so both can run at once for a parity run --
  # but point them at separate REDIS_URL databases if you do, or a shared warm
  # L2 will serve responses neither gateway actually produced. See parity/.
  api-python:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.python
    container_name: osrm-api-gateway-python
    profiles:
      - python
    ports:
      - "${PYTHON_API_PORT:-8082}:8000"
    env_file:
      - ../env/app.env
    environment:
      - OSRM_BASE_URL=http://osrm-backend:5000
      - REDIS_URL=redis://osrm-cache:6379/1
      - WORKERS=${API_WORKERS:-1}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-}
    depends_on:
      osrm:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # Rust evaluation spike -- a benchmark target, not a second gateway. Two of
  # eleven endpoints, no rate limiting, metrics, tracing, retry or L2 cache.
  # Behind a profile so it never starts with a plain `make compose-up`; bring it
  # up with `make spike-compose-up`, which drives the head-to-head documented in
  # rust-spike/README.md against the same engine the api service uses.
  spike:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.spike
    container_name: osrm-gateway-spike
    profiles:
      - spike
    ports:
      - "${SPIKE_PORT:-8081}:8001"
    # Same shared app settings the api service loads, so cache sizing and the
    # matrix cell budget match rather than merely resembling each other. Keys the
    # spike does not read (rate limits, tracing, VRP knobs) are simply ignored.
    env_file:
      - ../env/app.env
    environment:
      - OSRM_BASE_URL=http://osrm-backend:5000
      - HOST=0.0.0.0
      - PORT=8001
      # Match the api service's WORKERS for a fair comparison: this is tokio
      # worker threads against uvicorn worker processes. Raising one without the
      # other measures the configuration, not the gateway.
      - WORKERS=${API_WORKERS:-1}
    depends_on:
      osrm:
        condition: service_healthy
    restart: "no"
