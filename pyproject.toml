[project]
# The distribution is the `vrp` platform, because that is the part another
# repository can depend on. It was called `osrm-api-gateway` while nothing
# consumed it and the name cost nothing; shipping the routing platform under a
# name that says "gateway" would mislead every consumer, and renaming is free
# exactly once -- now, before anything pins it. The gateway itself is
# `gateway/`, a Rust binary, and is not a Python distribution at all.
name = "vrp-platform"
version = "0.4.0"
description = "Fleet-routing domain model, canonical evaluator and independent verifier"
readme = "README.md"
requires-python = ">=3.13"
# What `vrp/` imports at module level, and nothing else. `starlette` and
# `uvicorn` are here because `parity/engine.py` serves recorded fixtures and
# `T-102`'s successor hosts SDD 9.4 on them; `tests/test_packaging.py` keeps
# this list honest against the source rather than against memory.
dependencies = [
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The platform, not the workshop. `tests`, `parity` and `loadtest` exercise it
# and are not it; shipping them would put our test tooling in a consumer's
# install. `models/` stays out too -- see tests/test_packaging.py for why.
packages = ["vrp"]
# `vrp/bench/` resolves `docs/TDD/scenarios.jsonl` and `benchmarks/instances/`
# against the repository root, so an installed copy would find neither. It is
# the benchmark harness -- `CON-9`'s gate, run here, against this repository's
# corpus -- and means nothing to a consumer. `vrp/benchmarks.py` does ship:
# its reader takes the path from its caller, so it travels.
exclude = ["vrp/bench"]


[tool.uv.workspace]
members = ["examples"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Ruff's default rule set widens between releases -- 0.16 started flagging import
# order, typing modernisation and broad excepts that 0.5 did not. The exact pin in
# the dev extra is what keeps `make lint` deterministic; these ignores cover the
# two rules that conflict with how this service is built on purpose.
ignore = [
    # Route handlers catch Exception deliberately: an unhandled error must become
    # a 500 with a logged traceback, never a leaked stack trace. The cache and
    # tracing setup do the same to degrade instead of failing.
    "BLE001",
    # FastAPI's Depends()/Query()/Field() in parameter defaults is the framework's
    # idiom, not a mutable-default bug.
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The P0 corpus exists at three sizes (CAT-VRP-003 §13.1). Small carries the
# per-scenario assertions and runs on every commit; medium and large are marked
# slow, excluded from `make test`, and run by `make corpus`. Without the marker
# a full run of the corpus would put minutes into the loop nobody waits through.
markers = [
    "slow: the P0 corpus at medium and large size; run by `make corpus`",
]
# The repo root, so tests can import the dev-tree packages that are not part of
# the wheel: `loadtest` (payload builders) and `parity` (the differential
# harness). Without it pytest puts only `tests/` on sys.path.
pythonpath = [".", "tests"]




[project.optional-dependencies]
# `vrp.solve.pyvrp_adapter` imports pyvrp at module level and
# `vrp.solve.ortools_adapter` imports ortools inside its entry point, so a
# consumer that only builds and verifies Problems needs neither. Both are large
# compiled wheels, which is why they are extras rather than dependencies.
pyvrp = ["pyvrp>=0.14"]
ortools = ["ortools>=9.10"]
# `vrp/benchmarks.py` reads the public instances at module level through
# `vrplib`, which reaches the environment today only as a transitive dependency
# of pyvrp. That works until pyvrp drops it, at which point a reader that has
# nothing to do with pyvrp stops importing -- so it is declared here rather
# than inherited. `tests/test_packaging.py` is what noticed.
bench = ["vrplib>=2.0"]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff==0.16.4",
    # The CVRPTW solver behind `vrp/solve/pyvrp_adapter.py`, first of the
    # portfolio in SDD 7.3. In `dev` rather than an optional group on purpose:
    # CI installs this extra, and a solver test that always skips proves
    # nothing. It is a compiled wheel, so it costs install time -- worth it to
    # keep the benchmark gate (CON-9) able to run at all.
    "pyvrp>=0.14",
    # The second engine, SDD 7.3's "expressiveness escape hatch" (T-30). Also
    # in `dev` and for the same reason as pyvrp: an agreement test between two
    # engines that skips because one is missing proves nothing, and CON-3's
    # claim -- that no solver concept leaks into the domain layer -- is only
    # demonstrated by a second engine actually consuming the same Problem.
    "ortools>=9.10",
    # `tests/test_example_maps.py` checks the geometry behind the maps the
    # examples draw, and `tests/test_service_model_examples.py` checks that the
    # shipped delivery models rebuild the examples they describe. Both import
    # from `examples/src`, which reaches folium and the settings object, and CI
    # syncs this project rather than the workspace. In `dev` for the reason
    # pyvrp is: a hull cross-check and a model-equivalence proof that skip
    # because a wheel is missing prove nothing. Both are pure Python and small.
    "folium>=0.16.0",
    "pydantic-settings>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/lvalverdeb/osrm-microservice"
Repository = "https://github.com/lvalverdeb/osrm-microservice"
Documentation = "https://github.com/lvalverdeb/osrm-microservice#readme"
"Bug Tracker" = "https://github.com/lvalverdeb/osrm-microservice/issues"
