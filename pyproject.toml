[project]
name = "osrm-api-gateway"
version = "0.2.2"
description = "FastAPI gateway for OSRM routing engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "networkx>=3.2.1",
    "numpy>=1.26.0",
    "slowapi>=0.1.9",
    "cachetools>=5.3.3",
    "tenacity>=9.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "redis>=5.2.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[tool.uv.workspace]
members = ["examples"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "README*.md",
    "src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/lvalverdeb/osrm-microservice"
Repository = "https://github.com/lvalverdeb/osrm-microservice"
Documentation = "https://github.com/lvalverdeb/osrm-microservice#readme"
"Bug Tracker" = "https://github.com/lvalverdeb/osrm-microservice/issues"
